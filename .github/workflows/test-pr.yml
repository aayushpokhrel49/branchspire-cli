name: Test

on:
  pull_request:

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-unit:
    name: Lint, build and unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - run: make clean
      - run: make vet
      - run: make lint
      - run: make deadcode
      - run: make tidy-check
      - run: make fmt-check
      - run: make build
      - name: Vet the other release systems
        run: for os in darwin freebsd openbsd windows; do GOOS=$os go vet ./... || exit 1; done
      - run: make unit-test-coverage

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HTTP_PROXY: ""
      GITEA_CLI_TEST_URL: "http://localhost:3000"
      GITEA_CLI_TEST_TOKEN_FILE: /tmp/bh-ci-admin-token
      GITEA_CLI_TEST_REVIEWER_TOKEN_FILE: /tmp/bh-ci-reviewer-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      # GitHub service containers do not support `cmd`, so configure BranchSpire with env vars.
      - name: Start BranchSpire
        run: |
          docker run -d --name branchspire -p 3000:3000 \
            -e GITEA__database__DB_TYPE=sqlite3 \
            -e GITEA__server__ROOT_URL=http://localhost:3000 \
            -e GITEA__security__INSTALL_LOCK=true \
            -e GITEA__security__SECRET_KEY=2crAW4UANgvLipDS6U5obRcFosjSJHQANll6MNfX7P0G3se3fKcCwwK3szPyGcbo \
            -e GITEA__security__INTERNAL_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE1NTg4MzY4ODB9.LoKQyK5TN_0kMJFVHWUW0uDAyoGjDP6Mkup4ps2VJN4 \
            -e GITEA__security__PASSWORD_COMPLEXITY=off \
            -e GITEA__security__IMPORT_LOCAL_PATHS=true \
            docker.gitea.com/gitea:28.4.0

      - name: Wait for BranchSpire
        run: |
          for i in $(seq 1 30); do
            if curl --noproxy "*" -sf http://localhost:3000/api/v1/version; then
              echo "BranchSpire is ready after ${i} attempt(s)"
              exit 0
            fi
            echo "waiting for BranchSpire, attempt ${i}/30"
            sleep 2
          done
          echo "::error::BranchSpire did not become ready within 60s"
          exit 1

      - name: Create test accounts
        run: |
          docker exec branchspire gitea admin user create --username=integration --password=bh-local-integration-pass --email=integration@example.test --admin=true --must-change-password=false
          docker exec branchspire gitea admin user create --username=bh-reviewer --password=bh-local-reviewer-pass --email=bh-reviewer@example.test --admin=true --must-change-password=false

      - name: Create private token fixtures
        run: python3 scripts/integration-tokens.py
      - run: make integration-test
